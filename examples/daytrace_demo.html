.span-preview-arrow{font-size:14px;color:#8b8d7c}.span-preview-note{margin-top:8px;font-size:13px;line-height:1.7;color:#626b63}
@keyframes preview-enter{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:1100px){.view-name{display:none}}

@keyframes drawer-enter{from{opacity:.5;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
@media(max-width:1100px){.shell{padding-inline:18px;gap:10px}.topbar{gap:15px}.brand{gap:9px}.brand-date{padding-left:10px;font-size:17px}.brand-name{font-size:28px}.snapshot-badge{font-size:11px}.top-actions{gap:7px}.button{padding-inline:10px}.header-search{max-width:380px}.import-state{max-width:130px}.footer-left{gap:12px}.range-meta{display:none}}
@media(min-width:761px) and (max-width:900px){.brand{width:260px;flex-wrap:wrap;row-gap:2px}}
@media(max-width:760px){.shell{padding:0 12px 12px;gap:8px}.topbar{height:auto;min-height:112px;padding:13px 0 11px;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;row-gap:12px}.brand{gap:7px;flex-wrap:wrap;min-width:0}.brand-name{font-size:27px}.brand-date{font-size:16px;padding-left:8px}.snapshot-badge{font-size:11px}.top-actions{gap:6px}.button{padding:7px 10px;min-height:36px}.top-actions .button .ui-icon{display:none}.header-search{grid-column:1/-1;grid-row:2;max-width:none;width:100%;min-width:0}.header-search input{height:40px;font-size:16px}.toolbar{height:50px;gap:8px;padding:7px 10px}.toolbar-left{flex:1;min-width:0}.toolbar-right{gap:7px}.record-count{font-size:13px}.count-divider{margin:0 5px}.import-state{display:none}.range-window{font-size:13px}.zoom button{width:27px;height:30px}.zoom-label{min-width:28px}.display-options>summary{padding:5px}.display-options>summary>span{display:none}.chart-footer{padding:7px 10px;min-height:35px;gap:8px;font-size:12px}.legend{gap:12px}.footer-right{gap:9px}.disclosure{font-size:14px}.footer-right>#shown-count{display:none}.display-menu{width:230px}.drawer{padding:24px}.drawer h2{font-size:23px}}
@media(max-width:420px){.toolbar{flex-wrap:wrap;height:auto;min-height:78px;row-gap:5px}.toolbar-left{flex-basis:100%}.toolbar-right{width:100%;justify-content:space-between}.brand-date{font-size:15px}.brand{gap:5px}.brand-name{font-size:26px}.snapshot-badge{font-size:10px;padding:2px 4px}.button{font-size:13px;padding:7px 8px}.legend{gap:9px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media print{html,body{height:auto;overflow:visible}.top-actions,.header-search,.toolbar,.drawer,.drawer-shade,.display-options{display:none!important}.shell{height:auto;padding:0}.workspace{display:block}.chart-scroll{overflow:visible}.gantt{zoom:.65}.chart-panel{overflow:visible;box-shadow:none}.gantt-head{position:relative}.page-label{position:absolute}}
</style>

<symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M4 15v5h16v-5"/></symbol>

<div class="shell">
  <header class="topbar">
    <div class="brand"><span class="brand-name">PageAgo<em>.</em></span><span id="data-date" class="brand-date"></span><span id="snapshot-badge" class="snapshot-badge"></span></div>
    <div class="header-search"><svg class="ui-icon" aria-hidden="true"><use href="#i-search"></use></svg><input id="search" type="search" placeholder="搜索网页标题或网址" aria-label="搜索网页标题或网址" autocomplete="off" spellcheck="false"><button id="clear-search" class="clear-search" aria-label="清空搜索" hidden>×</button><span class="search-shortcut" aria-hidden="true">/</span></div>
    <div class="top-actions"><button id="import-button" class="button"><svg class="ui-icon" aria-hidden="true"><use href="#i-upload"></use></svg>导入</button><input id="import-file" type="file" accept=".json,application/json" hidden><button id="export-button" class="button primary"><svg class="ui-icon" aria-hidden="true"><use href="#i-download"></use></svg>保存</button></div>
  </header>
  <main class="workspace">
    <section id="timeline" class="chart-panel" aria-label="网页访问甘特图">
      <div class="toolbar">
        <div class="toolbar-left"><span class="view-name"><svg class="ui-icon" aria-hidden="true"><use href="#i-timeline"></use></svg>时间轴</span><span class="record-count" aria-live="polite"><b id="event-count">0</b> 次访问<span class="count-divider">·</span><b id="page-count">0</b> <span id="row-count-label">个网站</span></span><span id="import-state" class="import-state" role="status"></span></div>
        <div class="toolbar-right">
          <span class="range-window" aria-label="统计时间范围">06:00 — 24:00</span>
          <select id="group-by" class="group-picker" aria-label="时间轴分组"><option value="page">网页</option><option value="site">网站</option></select>
          <div class="zoom" aria-label="时间轴缩放"><button id="zoom-out" aria-label="缩小时间轴">−</button><button id="zoom-label" class="zoom-label" aria-label="还原时间轴缩放" title="还原缩放">1×</button><button id="zoom-in" aria-label="放大时间轴">+</button></div>
          <details id="display-options" class="display-options"><summary aria-label="显示设置"><svg class="ui-icon" aria-hidden="true"><use href="#i-info"></use></svg><span>显示</span></summary><div class="display-menu">
            <label class="span-toggle"><input id="show-spans" type="checkbox" checked>显示首末访问跨度</label>
            <label class="field-label">排序<select id="sort" aria-label="网页排序"><option value="first">首次访问</option><option value="latest">最近访问</option><option value="count">访问次数</option></select></label>
            <label id="profile-field" class="field-label" hidden>配置文件<select id="profile-filter" aria-label="筛选配置文件"><option value="all">全部配置文件</option></select></label>
            <div id="coverage-note" class="coverage"></div>
          </div></details>
        </div>
      </div>
      <div id="error" class="error" role="alert" hidden></div>
      <div id="chart-scroll" class="chart-scroll" tabindex="0" aria-label="可横向和纵向滚动的时间轴"><div id="gantt" class="gantt"></div></div>
<footer class="chart-footer"><div class="footer-left"><div class="legend"><span class="legend-item"><span class="legend-dot"></span>访问</span><span class="legend-item"><span class="legend-line"></span>首末跨度</span><span id="coverage-legend" class="legend-item" title="导出的时间范围未覆盖斜纹区域；不表示这段时间没有浏览。" hidden><span class="legend-gap"></span>未覆盖</span></div><span class="range-meta"><span id="range-label"></span><span id="timezone-label"></span></span></div><div class="footer-right"><span id="shown-count"></span><details class="disclosure"><summary aria-label="时间说明"><svg class="ui-icon" aria-hidden="true"><use href="#i-info"></use></svg></summary><p>菱形代表一次真实访问，横条表示首次至末次访问的跨度，不代表持续停留或学习时长。单次访问不画横条。斜纹表示导出的时间范围未覆盖，不代表没有浏览。</p></details></div></footer>
    </section>
  </main>
</div>
<div id="event-preview" class="event-preview" role="tooltip" hidden></div>
<div id="drawer-shade" class="drawer-shade" hidden></div>
<aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-labelledby="detail-title" hidden>
  <div class="drawer-top"><span id="detail-kind">网站 / 访问详情</span><button id="drawer-close" class="drawer-close" aria-label="关闭访问详情">×</button></div>
  <h2 id="detail-title"></h2><div id="detail-topic" class="detail-topic"></div>
  <div id="detail-tabs" class="detail-tabs" role="tablist" aria-label="访问记录组织方式" hidden><button id="detail-pages-tab" role="tab" aria-controls="detail-pages" aria-selected="true">网页</button><button id="detail-visits-tab" role="tab" aria-controls="detail-visits" aria-selected="false" tabindex="-1">访问</button></div>
  <section id="detail-pages" class="page-outline" role="tabpanel" aria-labelledby="detail-pages-tab" hidden></section>
  <section id="detail-visits" role="tabpanel" aria-labelledby="detail-visits-tab">
    <div id="detail-url" class="detail-url"></div><a id="detail-link" class="button" target="_blank" rel="noreferrer noopener">打开网页 ↗</a>
    <dl class="detail-grid"><div><dt>访问事件</dt><dd id="detail-count"></dd></div><div><dt>页面活动时长</dt><dd>未知 / 未采集</dd></div><div><dt>首次访问</dt><dd id="detail-first"></dd></div><div><dt>末次访问</dt><dd id="detail-last"></dd></div></dl>
    <p class="detail-note">下方只记录真实访问的时间点，不代表开始或结束活动。地址已隐藏查询参数，原始记录可通过证据 ID 查找。</p>
    <h3>每次访问 · 原始记录证据</h3><ol id="event-list" class="event-list"></ol>
  </section>
</aside>

<script>
(() => {

      const terms=[...new Set(state.query.split(/\s+/).filter(Boolean))].sort((a,b)=>b.length-a.length);
      highlightPattern=terms.length?new RegExp(terms.map(term=>term.replace(/[.*+?^$(){}|[\]\\]/g,'\\$&')).join('|'),'gi'):null;

    }
    fragment.append(text.slice(from));node.replaceChildren(fragment);return node;
  }
  const plain = value => String(value??'').replace(/[\u200b-\u200f\u202a-\u202e\u2060-\u206f\ufeff]/g,'');

    return Object.keys(siteIcons).filter(key=>domain===key||domain.endsWith('.'+key)).sort((a,b)=>b.length-a.length)[0]||domain.replace(/^www\./,'');
  }
  function siteIdentity(domain) {return siteIcons[siteDomain(domain)]||null;}
  function siteName(domain) {return plain(siteIdentity(domain)?.name)||domain.replace(/^www\./,'');}
  function siteAvatar(domain) {
    const box=el('span','site-avatar');box.setAttribute('aria-hidden','true');
    box.append(el('span','site-fallback',/^[a-z0-9]/i.test(domain)?domain.replace(/^www\./,'')[0].toUpperCase():'↗'));

    if(/^data:image\/(?:png|x-icon|vnd.microsoft.icon|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(address)){
      const image=el('img');image.alt='';image.width=28;image.height=28;image.decoding='async';image.src=address;
      image.onerror=()=>image.remove();box.append(image);
    }
    return box;
  }
  function error(message) { $('error').textContent=message;$('error').hidden=false; }
  function parseInstant(value) {if(typeof value!=='string'||!/(Z|[+-]\d{2}:\d{2})$/i.test(value)||!Number.isFinite(Date.parse(value)))throw Error('时间必须为带时区的 ISO 格式');return Date.parse(value);}
  function safeAddress(value) {try{const u=new URL(value);if(!['http:','https:'].includes(u.protocol))return '';u.username='';u.password='';u.search='';u.hash='';return u.href;}catch{return '';}}
  function normalize(raw) {
    const prepared = Array.isArray(raw.events);
    const visits = prepared ? raw.events : raw.visits;
    if(!Array.isArray(visits)||!['complete','partial'].includes(raw.status))throw Error('请选择成功或部分成功导出的历史记录 JSON');
    if(raw.event_count!==visits.length)throw Error('记录总数与事件列表不一致');

    const events=visits.map(e=>{
      if(typeof e.profile!=='string'||!e.profile||!Number.isSafeInteger(e.visit_id))throw Error('配置文件或访问 ID 无效');
      const id=JSON.stringify([e.profile,e.visit_id]);if(seen.has(id))throw Error('存在重复的访问 ID');seen.add(id);
      const time=prepared?e.time:e.visit_time,ms=parseInstant(time);if(ms<start||ms>end)throw Error('访问事件超出了声明的时间范围');
      if((e.title!=null&&typeof e.title!=='string')||(e.url!=null&&typeof e.url!=='string'))throw Error('网页标题与 URL 必须是文本');

      if(topics.has(topic_id)&&topics.get(topic_id)!==JSON.stringify([topic_label,kind]))throw Error('同一主题 ID 的名称或类型不一致');topics.set(topic_id,JSON.stringify([topic_label,kind]));
      const url=safeAddress(e.url);let domain='本地或内部页面';if(url)domain=new URL(url).hostname;
      const originalKey=(e.url||id).split('#')[0];if(!pageKeys.has(originalKey))pageKeys.set(originalKey,'imported-page-'+pageKeys.size);
      const page_key=prepared?e.page_key:pageKeys.get(originalKey);if(typeof page_key!=='string'||!page_key)throw Error('网页标识无效');
      return {id:`${e.profile}:${e.visit_id}`,profile:e.profile,visit_id:e.visit_id,time,title:plain(e.title)||'（无标题）',url,domain,page_key,topic_id,topic_label:plain(topic_label),kind};
    });
    return {schema_version:1,dataset_kind:raw.dataset_kind==='demo'?'demo':'personal',status:raw.status,start_time:raw.start_time,end_time:raw.end_time,event_count:events.length,failed_profiles:prepared?(raw.failed_profiles||0):(raw.errors||[]).length,events};
  }
  function offsetMinutes(value) {if(/Z$/i.test(value))return 0;const m=value.match(/([+-])(\d{2}):(\d{2})$/);return(m[1]==='-'?-1:1)*(Number(m[2])*60+Number(m[3]));}
  function displayOffset(){return offsetMinutes(state.data.end_time);}
  function hhmm(ms){return new Date(ms+displayOffset()*60000).toISOString().slice(11,16);}
  function clockText(value,milliseconds=false){const local=new Date(parseInstant(value)+displayOffset()*60000).toISOString().slice(11,23);return milliseconds&&!local.endsWith('.000')?local:local.slice(0,8);}
  function stamp(iso){return iso.slice(0,10)+' '+iso.slice(11,19);}
  function loadData(raw,awaitingImport=false) {
    const next=normalize(raw);state.data=next;state.awaitingImport=awaitingImport;searchOrigin=null;searchComposing=false;state.profile='all';state.query='';state.zoom=1;state.selected=null;state.expanded.clear();state.grouping='page';$('group-by').value='page';$('search').value='';closeDetail();$('chart-scroll').scrollTo(0,0);
    $('export-button').disabled=false;$('display-options').open=false;$('import-state').textContent='';
    const map=new Map();
    for(const e of next.events){
      const key=JSON.stringify([e.page_key,e.profile]);
      if(!map.has(key))map.set(key,{key,title:e.title,url:e.url,domain:e.domain,topic_id:e.topic_id,topic_label:e.topic_label,kind:e.kind,events:[],profile:e.profile});
      const page=map.get(key);page.events.push(e);
    }
    state.pages=[...map.values()].map(p=>{p.events.sort((a,b)=>Date.parse(a.time)-Date.parse(b.time)||a.visit_id-b.visit_id);const last=p.events.at(-1);p.title=last.title;p.first=Date.parse(p.events[0].time);p.last=Date.parse(last.time);p.color=domainColor(p.domain);return p;});
    const date=next.start_time.slice(0,10);$('data-date').textContent=date.replaceAll('-','.');
    const today=new Date();const localDate=[today.getFullYear(),String(today.getMonth()+1).padStart(2,'0'),String(today.getDate()).padStart(2,'0')].join('-');
    const demo=next.dataset_kind==='demo';
    $('snapshot-badge').textContent=demo?'DEMO · 示例数据':date===localDate?'当日快照':'历史快照';
    const utcOffset=displayOffset(),sign=utcOffset<0?'-':'+';
    $('timezone-label').textContent=' · UTC'+sign+String(Math.floor(Math.abs(utcOffset)/60)).padStart(2,'0')+':'+String(Math.abs(utcOffset)%60).padStart(2,'0');
    $('coverage-note').textContent=`${demo?'示例数据 · 合成访问事件':'本机数据'} / ${stamp(next.start_time)} — ${stamp(next.end_time)} · ${new Set(next.events.map(e=>e.profile)).size} 个配置文件`;
    $('profile-filter').replaceChildren(el('option','', '全部配置文件'));$('profile-filter').firstChild.value='all';
    const profiles=[...new Set(next.events.map(e=>e.profile))].sort();state.profiles=profiles;
    for(const profile of profiles){const option=el('option','',profile);option.value=profile;$('profile-filter').append(option);}
    $('profile-field').hidden=profiles.length<=1;
    $('error').hidden=true;if(next.status==='partial')error(`这是部分数据：${next.failed_profiles} 个配置文件读取失败；图中只展示成功读取的记录。`);
    render();
  }
  function windowPages(){
    const [start,end]=timeRange();

      const events=page.events.filter(e=>{const ms=Date.parse(e.time);return ms>=start&&ms<end;});
      if(!events.length)return null;
      return {...page,events,title:events.at(-1).title,first:Date.parse(events[0].time),last:Date.parse(events.at(-1).time)};
    }).filter(Boolean);
  }
  function filteredPages(){
    const terms=state.query.split(/\s+/).filter(Boolean);

      if(state.profile!=='all'&&p.profile!==state.profile)return false;
      if(!terms.length)return true;
      const text=(siteName(p.domain)+' '+p.title+' '+p.url+' '+p.domain+' '+p.events.map(e=>e.title).join(' ')).toLowerCase();

  document.addEventListener('keydown',e=>{if($('drawer').hidden)return;if(e.key==='Escape'){closeDetail();return;}if(e.key==='Tab'){const focusable=[...$('drawer').querySelectorAll('button,a[href],summary')].filter(n=>{const closed=n.closest('details:not([open])');return n.tabIndex>=0&&!n.closest('[hidden]')&&n.getClientRects().length&&(!closed||closed.querySelector(':scope > summary')?.contains(n));});const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
  $('group-by').onchange=e=>{state.grouping=e.target.value;state.selected=null;closeDetail();$('chart-scroll').scrollTop=0;render();};
  function setSearch(value){
    const chart=$('chart-scroll'),query=value.toLowerCase().trim();
    if(!currentPlot){state.query=query;return;}
    if(query===state.query)return;
    if(!state.query&&query)searchOrigin={time:(chart.scrollLeft+chart.clientWidth/2-60)/(currentPlot.width-84),top:chart.scrollTop};
    state.query=query;if(query)chart.scrollTop=0;render();
    if(!query){
      if(searchOrigin){chart.scrollLeft=60+searchOrigin.time*(currentPlot.width-84)-chart.clientWidth/2;chart.scrollTop=searchOrigin.top;searchOrigin=null;}
    }else{
      const first=$('gantt').querySelector('.event-marker')?.closest('.gantt-row'),points=first?[...first.querySelectorAll('.event-marker')].map(marker=>parseFloat(marker.style.left)):[];
      const left=chart.scrollLeft+12,right=chart.scrollLeft+chart.clientWidth-12;
      if(points.length&&!points.some(x=>x>=left&&x<=right)){
        const center=chart.scrollLeft+chart.clientWidth/2,target=points.reduce((best,x)=>Math.abs(x-center)<Math.abs(best-center)?x:best);
        chart.scrollLeft=target-chart.clientWidth/2;
      }
    }
    updateIdentities();
  }
  function clearSearch(){searchComposing=false;$('search').value='';setSearch('');$('search').focus();}
  $('clear-search').onclick=clearSearch;
  // Keep unfinished IME candidates out of the search, including Latin pinyin.
  $('search').addEventListener('compositionstart',()=>{searchComposing=true;});
  $('search').addEventListener('compositionend',e=>{searchComposing=false;setSearch(e.target.value);});
  $('search').addEventListener('input',e=>{if(!searchComposing&&!e.isComposing)setSearch(e.target.value);});$('sort').onchange=e=>{state.sort=e.target.value;render();};$('profile-filter').onchange=e=>{state.profile=e.target.value;render();};
  document.addEventListener('keydown',e=>{
    if(e.isComposing||!$('drawer').hidden)return;
    const editing=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName)||document.activeElement?.isContentEditable;
    if((e.key==='/'&&!editing)||((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k')){e.preventDefault();$('search').focus();$('search').select();}
    if(e.key==='Escape'){
      hidePreview();
      if(document.activeElement===$('search')){e.preventDefault();clearSearch();}
      $('display-options').open=false;
    }
  });
  document.addEventListener('click',e=>{if(!$('display-options').contains(e.target))$('display-options').open=false;});
  $('zoom-in').onclick=()=>zoomAt(Math.min(8,state.zoom*2));$('zoom-out').onclick=()=>zoomAt(Math.max(1,state.zoom/2));$('zoom-label').onclick=()=>zoomAt(1);$('show-spans').onchange=e=>{state.spans=e.target.checked;render();};
  $('import-button').onclick=()=>$('import-file').click();$('import-file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>30*1024*1024)throw Error('文件过大，请选择不超过 30 MB 的单日记录');const next=JSON.parse(await file.text());loadData(next);$('import-state').textContent='已导入 '+file.name;}catch(err){error('导入失败：'+err.message);}finally{e.target.value='';}};
  $('export-button').onclick=()=>{
    hidePreview();
    // Serialize current imported data into the inert JSON block, never executable HTML.
    const clone=document.documentElement.cloneNode(true);const safe=JSON.stringify(state.data).replace(/</g,'\\u003c').replace(/>/g,'\\u003e').replace(/&/g,'\\u0026');clone.querySelector('#timeline-data').textContent=safe;
    clone.querySelector('#gantt').replaceChildren();clone.querySelector('#drawer').hidden=true;clone.querySelector('#drawer-shade').hidden=true;
    const blob=new Blob(['<!doctype html>\n'+clone.outerHTML],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=el('a');a.href=url;a.download='pageago-'+state.data.start_time.slice(0,10)+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);
  };
  function resizeChart(){
    if(!currentPlot)return;
    const chart=$('chart-scroll'),time=(currentPlot.scrollLeft+currentPlot.viewportWidth/2-60)/(currentPlot.width-84),top=chart.scrollTop;
    const rememberControl=node=>{
      const cls=['event-marker','page-label','page-icon','site-toggle','visit-span'].find(name=>node?.classList.contains(name));if(!cls)return null;
      const eventId=node.dataset.eventId,pageKey=node.closest('.gantt-row')?.dataset.pageKey;
      return()=>[...$('gantt').querySelectorAll('.'+cls)].find(target=>eventId?target.dataset.eventId===eventId:target.closest('.gantt-row')?.dataset.pageKey===pageKey);
    };
    const focused=rememberControl(document.activeElement),opener=rememberControl(lastFocus);
    render();
    chart.scrollLeft=state.zoom===1?0:60+time*(currentPlot.width-84)-chart.clientWidth/2;chart.scrollTop=top;updateIdentities();
    if(opener)lastFocus=opener()||null;
    const replacement=focused?.();if(replacement)replacement.focus({preventScroll:true});
  }
  let resize;window.addEventListener('resize',()=>{clearTimeout(resize);resize=setTimeout(resizeChart,100);});
  try{
    const embedded=JSON.parse($('timeline-data').textContent);
    if(embedded.dataset_kind==='preview'){
      // Opening the source directly is a supported, offline import entry point.
      const now=new Date(),midnight=new Date(now);midnight.setHours(0,0,0,0);
      const localISO=date=>{const offset=-date.getTimezoneOffset(),sign=offset<0?'-':'+';return new Date(date.getTime()+offset*60000).toISOString().slice(0,-1)+sign+String(Math.floor(Math.abs(offset)/60)).padStart(2,'0')+':'+String(Math.abs(offset)%60).padStart(2,'0');};
      loadData({status:'complete',start_time:localISO(midnight),end_time:localISO(now),event_count:0,events:[]},true);
      $('snapshot-badge').textContent='等待导入';
      $('coverage-note').textContent='尚未载入浏览记录 · 支持原始或已分类的 JSON 导出';
      $('export-button').disabled=true;
    }else{loadData(embedded);}
  }catch(err){error('无法读取记录：'+err.message);}
  // A small read-only surface for local, dependency-free browser QA.
  window.timelineSnapshot=()=>({events:state.data?.event_count,pages:state.pages.length,shown:filteredPages().length,rows:visibleRows().length,windowEvents:windowPages().reduce((n,p)=>n+p.events.length,0),shownEvents:filteredPages().reduce((n,p)=>n+p.events.length,0),windowPages:windowPages().length,start:timeRange()[0],end:timeRange()[1],grouping:state.grouping,zoom:state.zoom,range:'06-24',status:state.data?.status});
})();
